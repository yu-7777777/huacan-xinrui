:root{color-scheme:light;--ink:#123832;--night:#082826;--gold:#b18b50;--line:#b18b507d;--paper:#f4e7cd;--song:"Songti SC",SimSun,serif;--brush:Tongpin,STXingkai,KaiTi,serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--song);background:radial-gradient(ellipse at 60% 0,#fcf4e2,#ead8b5 115%);display:grid;grid-template-columns:clamp(170px,15vw,248px) minmax(0,1fr);min-height:100dvh}

<aside>

<main id="directory">
  <header class="hero"><h1>一卷三章，循声而行</h1></header>
  <section class="chapter">
    <h2>节日共叙</h2>
    <p>一个节日，写下你我不同的生活记忆。</p>
    <a class="cta" href="index.html#culture">共写一笺 <span aria-hidden="true">→</span></a>
  </section>

    <div class="tag-window">
      <div class="tag-image">

        <span class="bike-tag macao"><small>澳門</small>單車</span>
        <span class="bike-tag taiwan"><small>台灣地區</small>腳踏車</span>
      </div>
    </div>
    <h2>同物异名</h2>
    <p>同一事物，各有表达。</p>
    <a class="cta" href="index.html#words">寻一个词 <span aria-hidden="true">→</span></a>
  </section>
  <section class="chapter">
    <h2>同一场风</h2>
    <p>读懂各地预警，把关心送给远方的家人。</p>
    <a class="cta" href="index.html#storm">查看风路 <span aria-hidden="true">→</span></a>
  </section>
  <footer>同频 · 从文化共鸣，到风雨共济。</footer>
</main>
<script>
document.addEventListener("click", event => {
  const control = event.target.closest("a[href], button[data-dialog]");
  if (!control || window.parent === window) return;
  const action = control.dataset.dialog || control.hash.slice(1);
  if (!["home", "culture", "words", "storm", "guide", "sources"].includes(action)) return;
  event.preventDefault();
  window.parent.postMessage({ type: "tongpin-directory", action }, location.origin);
});
</script></body>
